# Render Blueprint. Deploy: Render dashboard > New > Blueprint > pick this repo.
# Then set O1_API_KEY in the Render dashboard (Environment). Never put the key in this file.
services:
  - type: web
    name: o1-api-proxy
    runtime: docker
    rootDir: proxy
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: O1_API_KEY
        sync: false
      - key: RATE_PER_MIN
        value: "60"
